[project]
name = "auralis-model-lab"
version = "0.1.0"
description = "Pinned local-only offline adapters for Auralis Milestone 3 candidate evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.3.2",
    "onnxruntime==1.22.1",
    "pystoi==0.4.1",
    "scipy==1.16.1",
    "soundfile==0.13.1",
]

[project.scripts]
auralis-model-lab = "auralis_model_lab.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auralis_model_lab"]
